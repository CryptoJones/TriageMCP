name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Triage (sibling repo, editable)
        run: |
          git clone --depth=1 https://github.com/CryptoJones/Triage.git ../triage-src
          pip install -e ../triage-src
      - name: Install TriageMCP
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -v
