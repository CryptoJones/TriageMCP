when:
  - event: [push, pull_request]
    branch: main

steps:
  test-3-11:
    image: python:3.11-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - python -m pip install -U pip
      - git clone --depth=1 https://codeberg.org/CryptoJones/Triage.git ../triage-src
      - pip install -e ../triage-src
      - pip install -e '.[dev]'
      - ruff check src/ tests/
      - mypy
      - pip-audit
      - pytest -v
  test-3-12:
    image: python:3.12-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - python -m pip install -U pip
      - git clone --depth=1 https://codeberg.org/CryptoJones/Triage.git ../triage-src
      - pip install -e ../triage-src
      - pip install -e '.[dev]'
      - ruff check src/ tests/
      - mypy
      - pip-audit
      - pytest -v
