[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triagemcp"
version = "0.1.0"
description = "MCP server that exposes Triage (the meta-scheduler) as agent tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Aaron K. Clark", email = "akclark@thenetwerk.net" },
]
keywords = ["mcp", "triage", "task-management", "priority-queue", "claude", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=1.0.0",
  "triage-scheduler>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/CryptoJones/TriageMCP"
Repository = "https://github.com/CryptoJones/TriageMCP"
Mirror = "https://codeberg.org/CryptoJones/TriageMCP"
Issues = "https://github.com/CryptoJones/TriageMCP/issues"
Triage = "https://github.com/CryptoJones/Triage"
"Nebraska Footer" = "https://xkcd.com/2347/"

[project.scripts]
triagemcp = "triagemcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.9",
  "pip-audit>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triagemcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
# Default (non-strict) bar, matching the KaliMCP sibling: this is a thin
# FastMCP shim layer, so strict mode would mostly flag @mcp.tool() decorator
# and Any-generics noise rather than real bugs.
files = ["src"]

# triage-scheduler ships no py.typed marker, so mypy can't introspect it.
# Treat it as untyped rather than erroring on every import.
[[tool.mypy.overrides]]
module = "triage.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
